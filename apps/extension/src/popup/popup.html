<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MangaTest 设置</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>MangaTest</h1>
        <p id="page-host">配置后，在详情页使用浮动按钮一键提交</p>
      </header>

      <label>
        <span>本地服务</span>
        <input id="server-url" autocomplete="off" placeholder="http://127.0.0.1:4317" />
      </label>

      <label>
        <span>导入令牌</span>
        <input id="import-token" autocomplete="off" type="password" placeholder="在 MangaTest 安全设置中配置" />
      </label>

      <label class="checkbox-label">
        <input id="dev-mode" type="checkbox" />
        <span>开发模式（跳过令牌验证）</span>
      </label>

      <p id="status" role="status" data-tone="info">🔄 修改后自动保存</p>

      <footer>
        <p>详情页底部自动出现 📥 按钮，一键提交</p>
        <p>种子页下载链接旁自动出现 📥 MT 按钮，提交磁链+信息</p>
      </footer>
    </main>

    <script src="./popup.js" defer></script>
  </body>
</html>
