<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MangaTest 设置</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>MangaTest <span id="ext-version" style="font-size:12px;font-weight:600;color:#7c5166;"></span></h1>
        <p id="page-host">在支持的站点详情页或资源页使用页面内操作</p>
      </header>

      <label>
        <span>本地服务</span>
        <input id="server-url" autocomplete="off" placeholder="http://127.0.0.1:4427" />
      </label>

      <label>
        <span>导入令牌（可选）</span>
        <input id="import-token" autocomplete="off" type="password" placeholder="留空则跳过验证" />
      </label>

      <label class="checkbox-row">
        <input id="auto-download-torrent" type="checkbox" />
        <span>打开详情页时自动下载（默认关闭）</span>
      </label>

      <label>
        <span>自动提交种子数（默认 1，最大 10）</span>
        <input id="auto-torrent-count" type="number" min="1" max="10" step="1" />
      </label>

      <p id="status" role="status" data-tone="info">🔄 修改后自动保存</p>

      <footer>
        <p>详情页：提交信息 / 开启下载；已入库不会自动下载</p>
        <p>开启下载会由站点适配器打开对应资源页并提交资源</p>
        <p>资源页默认只显示手动提交按钮，自动流程会按页面来源匹配</p>
      </footer>
    </main>

    <script src="./popup.js" defer></script>
  </body>
</html>
